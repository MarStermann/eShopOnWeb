name: eShopOnWeb Build and Test

#Triggers (uncomment line below to use it)
#on: [push, pull_request, workflow_dispatch]

jobs:
  build:

    runs-on: [self-hosted, Linux, X64, unraid]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          dotnet-quality: 'preview'

      - name: Build with dotnet
        run: |-
          dotnet build ./eShopOnWeb.sln --configuration Release


      - name: Test with dotnet
        run: |-
          dotnet test ./eShopOnWeb.sln --configuration Release
    timeout-minutes: 60
    env:
      DOTNET_INSTALL_DIR: /opt/hostedtoolcache/dotnet
permissions:
  contents: read
env: {}
